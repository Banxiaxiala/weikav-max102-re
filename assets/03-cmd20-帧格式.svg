<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300"
     viewBox="0 0 780 300" font-family="ui-sans-serif, system-ui, -apple-system,
     'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" opacity=".65"/>
    </marker>
    <marker id="arw-g" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2ea043"/>
    </marker>
    <marker id="arw-r" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d1242f"/>
    </marker>
  </defs>
  <style>
    .bg    { fill: #ffffff; }
    .t     { fill: #1f2328; }
    .dim   { fill: #59636e; }
    .box   { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .boxg  { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.5; }
    .boxr  { fill: #ffebe9; stroke: #d1242f; stroke-width: 1.5; }
    .boxb  { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .bx    { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.2; }
    .ln    { stroke: currentColor; stroke-width: 1.6; fill: none;
              opacity: .55; }
    .lng   { stroke: #2ea043; stroke-width: 2; fill: none; }
    .lnr   { stroke: #d1242f; stroke-width: 2; fill: none; }
    .lnd   { stroke: currentColor; stroke-width: 1.4; fill: none;
              opacity: .35; stroke-dasharray: 5 4; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
              font-size: 11.5px; fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .t    { fill: #e6edf3; }
      .dim  { fill: #9198a1; }
      .box  { fill: #161b22; stroke: #30363d; }
      .boxg { fill: #12261e; stroke: #3fb950; }
      .boxr { fill: #271416; stroke: #f85149; }
      .boxb { fill: #0c1e33; stroke: #4493f8; }
      .bx   { fill: #161b22; stroke: #30363d; }
      .mono { fill: #9198a1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="300" rx="10"/>
<text class="t" x="24" y="36" font-size="15" font-weight="600" text-anchor="start">VIA cmd 20 响应格式（33 字节）</text>
<text class="dim" x="24" y="58" font-size="11.5" font-weight="400" text-anchor="start">实测帧：14 00 00 00 64 02 01 01 —— 只有前 8 个字节有意义</text>
<rect class="boxg" x="40" y="90" width="62" height="46" rx="5"/>
<text class="t" x="71.0" y="110" font-size="14" font-weight="600" text-anchor="middle">14</text>
<text class="dim" x="71.0" y="126" font-size="9.5" font-weight="400" text-anchor="middle">命令码</text>
<text class="dim" x="71.0" y="151" font-size="9.5" font-weight="400" text-anchor="middle">cmd 20</text>
<rect class="box" x="106" y="90" width="62" height="46" rx="5"/>
<text class="t" x="137.0" y="110" font-size="14" font-weight="600" text-anchor="middle">00</text>
<text class="dim" x="137.0" y="126" font-size="9.5" font-weight="400" text-anchor="middle">保留</text>
<rect class="box" x="172" y="90" width="62" height="46" rx="5"/>
<text class="t" x="203.0" y="110" font-size="14" font-weight="600" text-anchor="middle">00</text>
<text class="dim" x="203.0" y="126" font-size="9.5" font-weight="400" text-anchor="middle">保留</text>
<rect class="box" x="238" y="90" width="62" height="46" rx="5"/>
<text class="t" x="269.0" y="110" font-size="14" font-weight="600" text-anchor="middle">00</text>
<text class="dim" x="269.0" y="126" font-size="9.5" font-weight="400" text-anchor="middle">保留</text>
<rect class="boxg" x="304" y="90" width="62" height="46" rx="5"/>
<text class="t" x="335.0" y="110" font-size="14" font-weight="600" text-anchor="middle">64</text>
<text class="dim" x="335.0" y="126" font-size="9.5" font-weight="400" text-anchor="middle">电量</text>
<text class="dim" x="335.0" y="151" font-size="9.5" font-weight="400" text-anchor="middle">0–100</text>
<rect class="boxg" x="370" y="90" width="62" height="46" rx="5"/>
<text class="t" x="401.0" y="110" font-size="14" font-weight="600" text-anchor="middle">02</text>
<text class="dim" x="401.0" y="126" font-size="9.5" font-weight="400" text-anchor="middle">状态</text>
<text class="dim" x="401.0" y="151" font-size="9.5" font-weight="400" text-anchor="middle">2=已连接</text>
<rect class="box" x="436" y="90" width="62" height="46" rx="5"/>
<text class="t" x="467.0" y="110" font-size="14" font-weight="600" text-anchor="middle">01</text>
<text class="dim" x="467.0" y="126" font-size="9.5" font-weight="400" text-anchor="middle">模块版本</text>
<rect class="box" x="502" y="90" width="62" height="46" rx="5"/>
<text class="t" x="533.0" y="110" font-size="14" font-weight="600" text-anchor="middle">01</text>
<text class="dim" x="533.0" y="126" font-size="9.5" font-weight="400" text-anchor="middle">指示灯</text>
<text class="dim" x="533.0" y="151" font-size="9.5" font-weight="400" text-anchor="middle">bit0=Caps</text>
<text class="mono" x="71.0" y="82" text-anchor="middle">[0]</text>
<text class="mono" x="137.0" y="82" text-anchor="middle">[1]</text>
<text class="mono" x="203.0" y="82" text-anchor="middle">[2]</text>
<text class="mono" x="269.0" y="82" text-anchor="middle">[3]</text>
<text class="mono" x="335.0" y="82" text-anchor="middle">[4]</text>
<text class="mono" x="401.0" y="82" text-anchor="middle">[5]</text>
<text class="mono" x="467.0" y="82" text-anchor="middle">[6]</text>
<text class="mono" x="533.0" y="82" text-anchor="middle">[7]</text>
<rect class="box" x="568" y="90" width="196" height="46" rx="5"/>
<text class="dim" x="666" y="110" font-size="11" font-weight="400" text-anchor="middle">… 补齐到 33 字节</text>
<text class="dim" x="666" y="126" font-size="10" font-weight="400" text-anchor="middle">全部为 0x00</text>
<rect class="bx" x="40" y="190" width="700" height="54" rx="7"/>
<text class="t" x="56" y="210" font-size="12" font-weight="600" text-anchor="start">⚠️ 发送时必须补一个 0 在最前面（report id 占位）</text>
<text class="mono" x="56" y="230" text-anchor="start">d.write([0] + [0x14] + [0] * 31)   →  33 字节 ✔</text>
<text class="mono" x="400" y="230" text-anchor="start">d.write([0x14] + [0] * 32)        →  回 0xFF ✘</text>
<text class="dim" x="24" y="275" font-size="11" font-weight="400" text-anchor="start">原厂固件对 cmd &gt; 19 一律回 0xFF；见到 0xFF 只能判「没刷补丁」，绝不能当成 0%</text></svg>
