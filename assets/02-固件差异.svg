<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300"
     viewBox="0 0 780 300" font-family="ui-sans-serif, system-ui, -apple-system,
     'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" opacity=".65"/>
    </marker>
    <marker id="arw-g" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2ea043"/>
    </marker>
    <marker id="arw-r" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d1242f"/>
    </marker>
  </defs>
  <style>
    .bg    { fill: #ffffff; }
    .t     { fill: #1f2328; }
    .dim   { fill: #59636e; }
    .box   { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .boxg  { fill: #dafbe1; stroke: #2ea043; stroke-width: 1.5; }
    .boxr  { fill: #ffebe9; stroke: #d1242f; stroke-width: 1.5; }
    .boxb  { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .bx    { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.2; }
    .ln    { stroke: currentColor; stroke-width: 1.6; fill: none;
              opacity: .55; }
    .lng   { stroke: #2ea043; stroke-width: 2; fill: none; }
    .lnr   { stroke: #d1242f; stroke-width: 2; fill: none; }
    .lnd   { stroke: currentColor; stroke-width: 1.4; fill: none;
              opacity: .35; stroke-dasharray: 5 4; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
              font-size: 11.5px; fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .t    { fill: #e6edf3; }
      .dim  { fill: #9198a1; }
      .box  { fill: #161b22; stroke: #30363d; }
      .boxg { fill: #12261e; stroke: #3fb950; }
      .boxr { fill: #271416; stroke: #f85149; }
      .boxb { fill: #0c1e33; stroke: #4493f8; }
      .bx   { fill: #161b22; stroke: #30363d; }
      .mono { fill: #9198a1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="300" rx="10"/>
<text class="t" x="24" y="36" font-size="15" font-weight="600" text-anchor="start">原厂固件 vs 补丁固件：只差 100 个字节</text>
<text class="dim" x="24" y="58" font-size="11.5" font-weight="400" text-anchor="start">原厂 19 条 VIA 命令一个字节都没动，键位/灯效/USB 描述符全部保持原样</text>
<text class="t" x="24" y="84" font-size="12" font-weight="600" text-anchor="start">max102_stock_trimmed.bin   (69,632 B)</text>
<rect class="box" x="24" y="90" width="200" height="30" rx="4"/>
<text class="dim" x="124.0" y="109" font-size="10" font-weight="400" text-anchor="middle">原厂代码</text>
<rect class="box" x="227" y="90" width="150" height="30" rx="4"/>
<text class="dim" x="302.0" y="109" font-size="10" font-weight="400" text-anchor="middle">键位数据</text>
<rect class="box" x="380" y="90" width="110" height="30" rx="4"/>
<text class="dim" x="435.0" y="109" font-size="10" font-weight="400" text-anchor="middle">灯效表</text>
<rect class="box" x="493" y="90" width="90" height="30" rx="4"/>
<text class="dim" x="538.0" y="109" font-size="10" font-weight="400" text-anchor="middle">宏缓冲</text>
<rect class="box" x="586" y="90" width="140" height="30" rx="4"/>
<text class="dim" x="656.0" y="109" font-size="10" font-weight="400" text-anchor="middle">USB 描述符</text>
<text class="t" x="24" y="154" font-size="12" font-weight="600" text-anchor="start">max102_patched_battery.bin   (69,632 B)</text>
<rect class="boxg" x="24" y="160" width="200" height="30" rx="4"/>
<text class="dim" x="124.0" y="179" font-size="10" font-weight="400" text-anchor="middle">原厂代码</text>
<rect class="box" x="227" y="160" width="150" height="30" rx="4"/>
<text class="dim" x="302.0" y="179" font-size="10" font-weight="400" text-anchor="middle">键位数据</text>
<rect class="box" x="380" y="160" width="110" height="30" rx="4"/>
<text class="dim" x="435.0" y="179" font-size="10" font-weight="400" text-anchor="middle">灯效表</text>
<rect class="box" x="493" y="160" width="90" height="30" rx="4"/>
<text class="dim" x="538.0" y="179" font-size="10" font-weight="400" text-anchor="middle">宏缓冲</text>
<rect class="box" x="586" y="160" width="140" height="30" rx="4"/>
<text class="dim" x="656.0" y="179" font-size="10" font-weight="400" text-anchor="middle">USB 描述符</text>
<rect x="24" y="160" width="200" height="30" rx="4" fill="none" stroke="#2ea043" stroke-width="2.5" stroke-dasharray="6 3"/>
<rect class="bx" x="24" y="210" width="730" height="62" rx="7"/>
<text class="t" x="40" y="232" font-size="12" font-weight="600" text-anchor="start">改动集中在三处，共 100 字节（占 0.14%）</text>
<text class="mono" x="40" y="252" text-anchor="start">0xB678–0xB687   8 位偏移表 → 32 位指针表</text>
<text class="mono" x="40" y="266" text-anchor="start">0xFD82–0xFD9D   新增 cmd 20 处理函数</text>
<text class="dim" x="24" y="292" font-size="11" font-weight="400" text-anchor="start">其余 69,532 字节逐字节相同 —— 可用 cmp -l 自行验证</text></svg>
